# Weekly version updates for direct dependencies; CI (tests + bundle secret
# scan) must pass before any bump is merged. Advisories in transitive server
# deps (uuid/glob/minimatch under firebase-admin and googleapis) need new
# releases of those parents, which these PRs pick up. Dependabot branches get
# no Vercel preview build (vercel.json git.deploymentEnabled), so unreviewed
# install scripts never run with Preview env vars.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      google-firebase:
        patterns: ["firebase*", "googleapis*", "@google-cloud/*"]
        update-types: ["minor", "patch"]
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
