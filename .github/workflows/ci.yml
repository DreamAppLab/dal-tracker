name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Client secret guard (source)
        run: npm run check:secrets:src
      - name: API unit tests
        run: npm run test:api
      - name: React unit tests
        run: CI=true npx react-scripts test --watchAll=false
      - name: Firestore + Storage rules tests (emulator)
        run: npx -y firebase-tools@14 emulators:exec --project demo-dal-mission-control --only firestore,storage "node --test --test-concurrency=1 tests/rules/firestore.rules.test.mjs"
      - name: Production build + bundle secret scan
        run: |
          DISABLE_ESLINT_PLUGIN=true INLINE_RUNTIME_CHUNK=false GENERATE_SOURCEMAP=false CI=false npm run build
          npm run check:secrets:bundle
